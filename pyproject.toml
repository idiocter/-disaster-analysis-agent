[project]
name = "gis-disaster-agent"
version = "0.1.0"
description = "GIS disaster analysis agent: NL query -> retrieve datasets -> GIS analysis -> risk prediction -> map + report"
requires-python = ">=3.11,<3.12"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# Function-scoped event loops don't mix with the module-level async engine
# singleton in src/data/postgis_repo.py -- see autonomous-dev-agent's
# equivalent note for the full "another operation is in progress" story.
asyncio_default_fixture_loop_scope = "session"
